<!-- Static skeleton so Netlify detects the forms rendered by React at build time. -->
<!doctype html>
<html>
  <body>
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto" />
      <input name="bot-field" />
      <input name="nombre" />
      <input name="email" />
      <input name="empresa" />
      <input name="telefono" />
      <select name="servicio"><option value="">-</option></select>
      <select name="presupuesto"><option value="">-</option></select>
      <textarea name="mensaje"></textarea>
      <input type="checkbox" name="consentimiento" />
    </form>
    <form name="postulacion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="postulacion" />
      <input name="bot-field" />
      <input name="programa" />
      <input name="nombre" />
      <input name="email" />
      <input name="telefono" />
      <input name="area" />
      <input name="portafolio" />
      <textarea name="motivacion"></textarea>
      <input type="checkbox" name="consentimiento" />
    </form>
  </body>
</html>
